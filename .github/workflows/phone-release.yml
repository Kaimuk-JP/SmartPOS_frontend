name: Phone Release

# build frontend สำหรับเซิร์ฟเวอร์มือถือ (Termux) แล้วปล่อยเป็น GitHub Release
# มือถือจะดึงไฟล์ frontend.tar.gz ไปใช้เองด้วยคำสั่ง pos-update (เหมือน docker pull)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (ใช้ได้ทุกโดเมน, anon key ใส่ทีหลังบนมือถือ)
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SUPABASE_URL: /
          NEXT_PUBLIC_SUPABASE_ANON_KEY: __PHONE_SUPABASE_ANON_KEY__
          NEXT_PUBLIC_HIDE_DEMO_LOGIN: 1
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Package standalone
        run: |
          mkdir -p out/.next
          cp -r .next/standalone/. out/
          cp -r .next/static out/.next/
          cp -r public out/
          echo "$GITHUB_SHA" > out/BUILD_SHA
          tar -C out -czf frontend.tar.gz .

      - name: Publish release (เก็บไว้ 5 เวอร์ชันล่าสุด)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="phone-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "PHONE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" frontend.tar.gz --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Phone build of $GITHUB_SHA"
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^phone-' | tail -n +6 | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      # ---- สั่งมือถืออัปเดตทันที (ต้องตั้ง secrets TS_AUTHKEY + DEPLOY_TOKEN ก่อน ไม่งั้นข้ามขั้นนี้) ----
      - name: Join tailnet
        if: env.TS_AUTHKEY != '' && env.DEPLOY_TOKEN != ''
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: github-actions-smartpos
          version: latest

      - name: Tell phone to update
        if: env.TS_AUTHKEY != '' && env.DEPLOY_TOKEN != ''
        run: |
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 -X POST             --resolve pos.tailb2a25e.ts.net:443:100.118.183.38             -H "Authorization: Bearer $DEPLOY_TOKEN"             "https://pos.tailb2a25e.ts.net/__deploy?app=frontend&tag=$PHONE_TAG"
